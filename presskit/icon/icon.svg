<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="JotRelay icon">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1c22"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="176" y1="184" x2="416" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Back card — an unfilled outline, not a second flat shape: reads as
       "the other synced copy" behind the primary one, with the offset
       between the two (rather than a separate refresh-arrow glyph) doing
       the work of suggesting sync/mirroring. -->
  <rect x="96" y="88" width="240" height="240" rx="46" fill="none" stroke="#f5a623" stroke-opacity="0.4" stroke-width="16"/>

  <!-- Front card — primary, brand-amber -->
  <rect x="176" y="184" width="240" height="240" rx="46" fill="url(#cardGrad)"/>
  <rect x="214" y="264" width="150" height="20" rx="10" fill="#1c1305" fill-opacity="0.4"/>
  <rect x="214" y="308" width="150" height="20" rx="10" fill="#1c1305" fill-opacity="0.4"/>
  <rect x="214" y="352" width="100" height="20" rx="10" fill="#1c1305" fill-opacity="0.4"/>
</svg>
