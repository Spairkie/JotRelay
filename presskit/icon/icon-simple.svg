<!-- Simplified single-card variant of icon.svg, tuned for legibility at
     favicon / small app-icon sizes (16–64px). Same palette, fewer strokes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SyncPad icon">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1c22"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="140" y1="120" x2="372" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="140" y="120" width="232" height="272" rx="34" fill="url(#cardGrad)"/>

  <!-- Bold sync-loop glyph, no thin content lines -->
  <g transform="translate(178,196) scale(4.9)" fill="none" stroke="#0f0f11" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="23 4 23 10 17 10"/>
    <polyline points="1 20 1 14 7 14"/>
    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
  </g>
</svg>
